<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Artwork - NexArt</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-state.js"></script>
</head>
<body>
  <!-- Header/Nav -->
  <header>
    <nav class="nav-container">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="artists.html">Artists</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <div class="auth-nav">
        <a href="auth.html" id="loginLink" class="hidden">Login</a>
        <a href="dashboard.html" id="dashboardLink">Dashboard</a>
        <a href="admin.html" id="adminLink" class="hidden">Admin</a>
        <a href="#" id="logoutLink" onclick="handleLogout(); return false;">Logout</a>
      </div>
    </nav>
  </header>

  <main class="upload-main">
    <div class="upload-container">
      <div class="upload-header">
        <h1>Upload Artwork</h1>
        <p>Share your art with the NexArt community</p>
      </div>

      <form id="uploadForm" class="upload-form">
        <div class="form-section">
          <h3>Artwork Image *</h3>
          <div class="image-upload-area" id="imageUploadArea">
            <input type="file" id="artworkImage" accept="image/jpeg,image/png,image/gif,image/webp" required style="display: none;">
            <label for="artworkImage" class="upload-label">
              <div class="upload-icon">📸</div>
              <p>Click to select or drag and drop</p>
              <small>JPG, PNG, GIF, WEBP (Max 5MB)</small>
            </label>
          </div>
          <div id="imagePreview" class="image-preview"></div>
        </div>

        <div class="form-section">
          <h3>Artwork Details</h3>

          <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" maxlength="100" required placeholder="Give your artwork a title">
            <small class="char-count"><span id="titleCount">0</span>/100</small>
          </div>

          <div class="form-group">
            <label for="description">Description *</label>
            <textarea id="description" maxlength="500" required rows="5" placeholder="Describe your artwork, inspiration, techniques used..."></textarea>
            <small class="char-count"><span id="descCount">0</span>/500</small>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="year">Year</label>
              <input type="number" id="year" min="1900" max="2026" placeholder="2026">
            </div>

            <div class="form-group">
              <label for="medium">Medium</label>
              <select id="medium">
                <option value="">Select medium</option>
                <option value="Digital Art">Digital Art</option>
                <option value="Photography">Photography</option>
                <option value="Illustration">Illustration</option>
                <option value="Painting">Painting</option>
                <option value="Mixed Media">Mixed Media</option>
                <option value="3D Art">3D Art</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="isPublished" checked>
              <span>Publish immediately (uncheck to save as draft)</span>
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" onclick="window.location.href='dashboard.html'" class="btn-secondary">Cancel</button>
          <button type="submit" id="submitBtn" class="btn-primary">
            <span id="btnText">Upload Artwork</span>
          </button>
        </div>

        <div id="uploadProgress" class="upload-progress"></div>
        <div id="uploadMessage" class="message"></div>
      </form>
    </div>
  </main>

  <script src="js/upload.js"></script>
</body>
</html>
